{% extends 'dogs/base.html' %}
{% load my_tags %}
{% block content %}
<form method="POST" enctype="multipart/form-data" class="row">
    <div class="col-6">
        <div class="card">
            <div class="card-header">
                {% if object %}
                Вы уверены, что хотите удалить собаку?
                {% endif %}
            </div>
            <div class="card-body">
                <img class="card-img-top"
                     src="{{ object.photo|dogs_media }}" width="300" height="320"
                     alt="Card image cap">
                <p class="card-text">{{ object }}</p>
            </div>
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger">
                {% if object %}
                Удалить
                {% endif %}
            </button>
        </div>
    </div>
</form>
{% endblock %}
